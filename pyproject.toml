[project]
name = "ai-testguard"
version = "1.0.0"
description = "Qualification (tests, robustesse, non-régression) d'un modèle de détection de fraude bancaire"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests d'intégration de bout en bout",
    "slow: tests longs (exclus des Pull Requests)",
    "perf: tests de performance (latence, débit, taille)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
